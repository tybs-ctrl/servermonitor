name: Publishing container to dh

on: 
  push
jobs:
  build_and_publish:
    
    runs-on: [self-hosted, linux, x64, docker]
    
    steps:
      - uses: actions/checkout@v7
      - name: Build and push image 
        run: |
          docker login --username tybsct --password ${{secrets.DH_PAT}}
          docker build . -t tybsct/servermonitor:latest
          docker push tybsct/servermonitor:latest

